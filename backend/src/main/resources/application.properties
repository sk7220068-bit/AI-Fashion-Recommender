# =====================================================
# AI Fashion Recommender — Application Configuration
# =====================================================

# Server
server.port=8080
spring.application.name=ai-fashion-recommender

# ── MongoDB ──────────────────────────────────────────
spring.data.mongodb.uri=mongodb://localhost:27017/fashionai
spring.data.mongodb.database=fashionai

# ── File Upload ──────────────────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── ML Microservice (Python Flask) ───────────────────
ml.service.base-url=http://localhost:5001
ml.service.detect-endpoint=/detect
ml.service.features-endpoint=/extract-features
ml.service.timeout-seconds=30

# ── Dataset ──────────────────────────────────────────
dataset.outfits-csv-path=classpath:dataset/outfits.csv


# ── Recommendation Engine ─────────────────────────────
recommendation.similarity-threshold=0.5
recommendation.max-results=10

# ── Compatibility Scoring ─────────────────────────────
compatibility.score-threshold=0.6

# ── Optional: OpenAI API (for generative suggestions) ─
openai.api.key=${OPENAI_API_KEY:}
openai.api.enabled=false
openai.api.model=gpt-4o

# ── Actuator ─────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── Logging ──────────────────────────────────────────
logging.level.com.fashionai=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
